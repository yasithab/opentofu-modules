name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel any in-progress run for the same PR when a new commit is pushed.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── 1. Format (check-only) ────────────────────────────────────────────────
  # Deliberately check-only: running the PR head's Taskfile with a
  # push-capable token and auto-committing allowed untrusted PR code to
  # execute with write access. Formatting drift now simply fails the PR;
  # contributors run `task format` locally instead.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Check out repository code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 1

    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
      with:
        tofu_version: "1.11.5"

    - name: Check formatting
      run: tofu fmt -check -recursive -diff .

  # ── 2. Validate changed modules ──────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs immediately (no needs) - format is check-only, so all PR jobs
    # start in parallel. Only changed modules (plus ancestors/consumers)
    # are validated; the release workflow still validates everything.
    permissions:
      contents: read
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

    steps:
    - name: Check out repository code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0

    - name: Detect changed modules
      id: changes
      run: |
        BASE_SHA=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD)
        CHANGED=$(bash .github/scripts/detect-changed-modules.sh "$BASE_SHA" HEAD)
        echo "modules=$CHANGED" >> "$GITHUB_OUTPUT"
        COUNT=$(echo "$CHANGED" | tr ',' '\n' | grep -c '[^[:space:]]' || true)
        echo "count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "Changed modules ($COUNT): $CHANGED"

    - name: Setup OpenTofu
      if: steps.changes.outputs.count != '0'
      uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
      with:
        tofu_version: "1.11.5"

    - name: Cache OpenTofu provider plugins
      if: steps.changes.outputs.count != '0'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ env.TF_PLUGIN_CACHE_DIR }}
        key: opentofu-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
        restore-keys: |
          opentofu-providers-${{ runner.os }}-

    - name: Validate changed modules
      id: validate
      if: steps.changes.outputs.count != '0'
      run: |
        set -o pipefail
        mkdir -p "$TF_PLUGIN_CACHE_DIR"
        JOBS=$(nproc 2>/dev/null || echo 4)
        echo "${{ steps.changes.outputs.modules }}" | tr ',' '\n' | grep '[^[:space:]]' | \
          xargs -P "$JOBS" -I MODDIR bash -c '
            echo "Validating module: MODDIR"
            cd "MODDIR" && tofu init -backend=false -no-color > /dev/null && tofu validate -no-color
          ' 2>&1 | tee /tmp/validate-output.txt
      continue-on-error: true

    - name: No changes
      if: steps.changes.outputs.count == '0'
      run: echo "⏭️ No module changes detected - validation skipped" | tee /tmp/validate-output.txt

    - name: Step Summary
      if: always()
      run: |
        {
          echo "## Validate"
          echo ""
          if [ "${{ steps.validate.outcome }}" = "failure" ]; then
            echo "❌ Validation failed - see output below"
          else
            echo "✅ Changed modules validated successfully"
          fi
          echo ""
          echo "<details><summary>Full output</summary>"
          echo ""
          echo '```'
          cat /tmp/validate-output.txt
          echo '```'
          echo ""
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fail if validation errored
      if: steps.validate.outcome == 'failure'
      run: exit 1

  # ── 3. Lint changed modules ──────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No needs - starts in parallel with every other PR job; lints only
    # changed modules (plus ancestors/consumers).
    permissions:
      contents: read

    steps:
    - name: Check out repository code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0

    - name: Detect changed modules
      id: changes
      run: |
        BASE_SHA=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD)
        CHANGED=$(bash .github/scripts/detect-changed-modules.sh "$BASE_SHA" HEAD)
        echo "modules=$CHANGED" >> "$GITHUB_OUTPUT"
        COUNT=$(echo "$CHANGED" | tr ',' '\n' | grep -c '[^[:space:]]' || true)
        echo "count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "Changed modules ($COUNT): $CHANGED"

    - name: Setup tflint
      if: steps.changes.outputs.count != '0'
      uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2
      with:
        tflint_version: v0.55.1

    - name: Cache tflint plugins
      if: steps.changes.outputs.count != '0'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.tflint.d/plugins
        key: tflint-plugins-${{ runner.os }}-${{ hashFiles('.tflint.hcl') }}

    - name: Init tflint plugins
      if: steps.changes.outputs.count != '0'
      run: tflint --init
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Lint changed modules
      id: lint
      if: steps.changes.outputs.count != '0'
      run: |
        set -o pipefail
        JOBS=$(nproc 2>/dev/null || echo 4)
        echo "${{ steps.changes.outputs.modules }}" | tr ',' '\n' | grep '[^[:space:]]' | \
          xargs -P "$JOBS" -I MODDIR bash -c '
            echo "Linting module: MODDIR"
            tflint --chdir "MODDIR"
          ' 2>&1 | tee /tmp/lint-output.txt
      continue-on-error: true

    - name: No changes
      if: steps.changes.outputs.count == '0'
      run: echo "⏭️ No module changes detected - lint skipped" | tee /tmp/lint-output.txt

    - name: Step Summary
      if: always()
      run: |
        {
          echo "## Lint"
          echo ""
          if [ "${{ steps.lint.outcome }}" = "failure" ]; then
            echo "❌ Linting issues detected - see output below"
          else
            echo "✅ No linting issues found"
          fi
          echo ""
          echo "<details><summary>Full output</summary>"
          echo ""
          echo '```'
          cat /tmp/lint-output.txt
          echo '```'
          echo ""
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fail if lint errored
      if: steps.lint.outcome == 'failure'
      run: exit 1

  # ── 4. Terratest (validate + plan) ────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # This job assumes a (read-only) AWS role via OIDC while running code
    # from the PR head. The environment lets repository protection rules
    # require reviewer approval before untrusted PR code can reach AWS.
    environment: aws-plan
    permissions:
      contents: read
      id-token: write   # Required for OIDC
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    outputs:
      modules: ${{ steps.changes.outputs.modules }}
      count: ${{ steps.changes.outputs.count }}

    steps:
    - name: Check out repository code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0

    - name: Detect changed modules
      id: changes
      run: |
        # Walks UP to every ancestor module of a changed dir AND DOWN to
        # local-source consumers (wrappers, submodule callers) of changed
        # modules - see .github/scripts/detect-changed-modules.sh.
        BASE_SHA=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD)
        CHANGED=$(bash .github/scripts/detect-changed-modules.sh "$BASE_SHA" HEAD)
        echo "modules=$CHANGED" >> "$GITHUB_OUTPUT"
        COUNT=$(echo "$CHANGED" | tr ',' '\n' | grep -c '[^[:space:]]' || true)
        echo "count=$COUNT" >> "$GITHUB_OUTPUT"
        echo "Changed modules ($COUNT): $CHANGED"

    - name: Setup OpenTofu
      if: steps.changes.outputs.count != '0'
      uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
      with:
        tofu_version: "1.11.5"

    - name: Setup Go
      if: steps.changes.outputs.count != '0'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: test/go.mod
        cache-dependency-path: test/go.sum

    - name: Configure AWS credentials via OIDC
      if: steps.changes.outputs.count != '0'
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
      with:
        role-to-assume: ${{ secrets.AWS_MGMT_RO_ROLE_ARN }}
        aws-region: us-east-1
        role-session-name: terratest-pr-${{ github.event.pull_request.number }}

    - name: Cache OpenTofu provider plugins
      if: steps.changes.outputs.count != '0'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ env.TF_PLUGIN_CACHE_DIR }}
        key: opentofu-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
        restore-keys: |
          opentofu-providers-${{ runner.os }}-

    - name: Create provider plugin cache dir
      if: steps.changes.outputs.count != '0'
      run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

    - name: Run Terratest (all suites)
      id: plan_test
      if: steps.changes.outputs.count != '0'
      working-directory: test
      env:
        TEST_MODULES: ${{ steps.changes.outputs.modules }}
      # One invocation, no -run filter: the plan and fixture-matrix suites
      # run, and top-level t.Parallel() lets them interleave (validate,
      # disabled-path and negative-validation coverage moved to the
      # creds-free offline tofu tests). tofu init/plan subtests are
      # I/O-bound (network, AWS API latency), so -parallel goes well
      # beyond core count.
      run: |
        set -o pipefail
        go test -v -timeout 30m -count=1 -parallel=16 2>&1 | tee /tmp/plan-test-output.txt
      continue-on-error: true

    - name: Step Summary
      if: always()
      run: |
        if [ "${{ steps.changes.outputs.count }}" = "0" ]; then
          echo "## Terratest Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "⏭️ No module changes detected - tests skipped" >> "$GITHUB_STEP_SUMMARY"
        else
          bash .github/scripts/terratest-summary.sh /tmp/plan-test-output.txt >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Fail if tests errored
      if: |
        steps.changes.outputs.count != '0' &&
        steps.plan_test.outcome == 'failure'
      run: exit 1

  # ── 5. OPA policy gate (conftest on plan JSON) ────────────────────────────
  # Re-plans each changed module with its CI fixture, exports the plan JSON
  # and evaluates it against the rego policies in policy/ (required tags,
  # no world-open SG ingress, encryption-at-rest, deletion protection).
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]
    if: needs.test.outputs.count != '0'
    # Same OIDC plan role and protected environment as the terratest job.
    environment: aws-plan
    permissions:
      contents: read
      id-token: write   # Required for OIDC
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
      CONFTEST_VERSION: "0.68.2"
      # sha256 of conftest_0.68.2_Linux_x86_64.tar.gz from the release checksums.txt
      CONFTEST_SHA256: "e8144c6d6d2ae0260b869caa60c7c262a1f95ac63ec1e5d2fb19be452d606347"

    steps:
    - name: Check out repository code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 1

    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
      with:
        tofu_version: "1.11.5"

    - name: Install conftest (pinned, checksum-verified)
      run: |
        curl -fsSL -o /tmp/conftest.tar.gz \
          "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
        echo "${CONFTEST_SHA256}  /tmp/conftest.tar.gz" | sha256sum -c -
        tar -xzf /tmp/conftest.tar.gz -C /tmp conftest
        sudo install -m 0755 /tmp/conftest /usr/local/bin/conftest
        conftest --version

    - name: Run policy unit tests
      run: conftest verify --policy policy/

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
      with:
        role-to-assume: ${{ secrets.AWS_MGMT_RO_ROLE_ARN }}
        aws-region: us-east-1
        role-session-name: conftest-pr-${{ github.event.pull_request.number }}

    - name: Cache OpenTofu provider plugins
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ env.TF_PLUGIN_CACHE_DIR }}
        key: opentofu-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
        restore-keys: |
          opentofu-providers-${{ runner.os }}-

    - name: Create provider plugin cache dir
      run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

    - name: Evaluate policies against changed module plans
      id: conftest
      env:
        MODULES: ${{ needs.test.outputs.modules }}
      run: |
        set -o pipefail
        bash .github/scripts/conftest-plan.sh "$MODULES" 2>&1 | tee /tmp/conftest-output.txt
      continue-on-error: true

    - name: Step Summary
      if: always()
      run: |
        {
          echo "## Policy Check (conftest)"
          echo ""
          if [ "${{ steps.conftest.outcome }}" = "success" ]; then
            echo "✅ All changed module plans satisfy policy"
          else
            echo "❌ Policy violations detected - see output below"
          fi
          echo ""
          echo "<details><summary>Full output</summary>"
          echo ""
          echo '```'
          cat /tmp/conftest-output.txt 2>/dev/null || echo "(no output)"
          echo '```'
          echo ""
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fail if policy check errored
      if: steps.conftest.outcome != 'success'
      run: exit 1

  # ── 6. Security scan ──────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Check out repository code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 1

    - name: Run Trivy security scan
      id: trivy
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
      continue-on-error: true
      with:
        scan-type: config
        scan-ref: .
        format: table
        output: trivy-results.txt
        exit-code: "1"
        severity: CRITICAL,HIGH
        skip-dirs: ".git,.github,.terrateam"
        version: "v0.69.3"
        cache: "true"

    - name: Step Summary
      if: always()
      run: |
        {
          echo "## Security Scan"
          echo ""
          if [ "${{ steps.trivy.outcome }}" = "success" ]; then
            echo "✅ No CRITICAL/HIGH findings"
          else
            echo "❌ CRITICAL/HIGH findings detected - see output below"
          fi
          echo ""
          echo "<details><summary>Trivy scan output</summary>"
          echo ""
          echo '```'
          cat trivy-results.txt 2>/dev/null || echo "(no output)"
          echo '```'
          echo ""
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fail if findings detected
      if: steps.trivy.outcome != 'success'
      run: exit 1

  # ── 7. Offline tofu tests (mock providers) ───────────────────────────────
  # Creds-free early net for the disabled-path/null-ref bug class: runs the
  # native `tofu test` suites (tests/*.tftest.hcl with mock providers,
  # covering enabled + disabled plan paths and the expect_failures
  # negative-validation runs) across ALL modules - they are
  # fast and need no credentials, so no changed-module scoping; this gives
  # the full-fleet coverage that the changed-module jobs can't. The OIDC
  # terratest job above still does real-API plans on changed modules.
  # No needs - starts in parallel with every other PR job. Deliberately
  # NO aws-plan environment and NO OIDC.
  offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

    steps:
    - name: Check out repository code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 1

    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
      with:
        tofu_version: "1.11.5"

    - name: Cache OpenTofu provider plugins
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ env.TF_PLUGIN_CACHE_DIR }}
        key: opentofu-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
        restore-keys: |
          opentofu-providers-${{ runner.os }}-

    - name: Run offline tofu tests (all modules)
      id: offline
      run: |
        set -o pipefail
        mkdir -p "$TF_PLUGIN_CACHE_DIR"
        : > /tmp/offline-failures.txt
        JOBS=$(nproc 2>/dev/null || echo 4)
        find . -type f -name "*.tftest.hcl" -path "*/tests/*" \
          -not -path "*/.terraform/*" \
          -not -path "*/.terraform-plugin-cache/*" | \
          xargs -n1 dirname | xargs -n1 dirname | sort -u | \
          xargs -P "$JOBS" -I MODDIR bash -c '
            echo "Offline testing module: MODDIR"
            if ! (cd "MODDIR" && tofu init -backend=false -no-color > /dev/null && tofu test -no-color); then
              echo "MODDIR" >> /tmp/offline-failures.txt
              exit 1
            fi
          ' 2>&1 | tee /tmp/offline-test-output.txt
      continue-on-error: true

    - name: Step Summary
      if: always()
      run: |
        {
          echo "## Offline Tests (tofu test, mock providers)"
          echo ""
          if [ "${{ steps.offline.outcome }}" = "failure" ]; then
            echo "❌ Offline tests failed in:"
            echo ""
            sort -u /tmp/offline-failures.txt 2>/dev/null | sed 's/^/- `/; s/$/`/'
          else
            echo "✅ All module offline tests passed"
          fi
          echo ""
          echo "<details><summary>Full output</summary>"
          echo ""
          echo '```'
          cat /tmp/offline-test-output.txt 2>/dev/null || echo "(no output)"
          echo '```'
          echo ""
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fail if offline tests errored
      if: steps.offline.outcome == 'failure'
      run: exit 1
