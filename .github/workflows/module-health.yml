name: Module Health Check

on:
  schedule:
    - cron: "0 8 1 * *"  # First day of each month at 08:00 UTC
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
        with:
          tofu_version: "1.11.5"

      - name: Cache OpenTofu provider plugins
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: opentofu-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            opentofu-providers-${{ runner.os }}-

      - name: Create provider plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Check modules missing README
        id: missing_readme
        run: |
          MISSING=""
          for main_tf in $(find . -name "main.tf" -not -path "*/.terraform/*" | sort); do
            dir=$(dirname "$main_tf")
            mod=$(echo "$dir" | sed 's|^\./||')
            if [ ! -f "$dir/README.md" ]; then
              MISSING="$MISSING\n- \`$mod\`"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo -e "$MISSING" > /tmp/missing-readme.txt
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run full validation
        id: validate
        run: |
          FAILED=""
          TOTAL=0
          PASS=0
          for main_tf in $(find . -name "main.tf" -not -path "*/.terraform/*" | sort); do
            dir=$(dirname "$main_tf")
            mod=$(echo "$dir" | sed 's|^\./||')
            TOTAL=$((TOTAL + 1))
            cd "$GITHUB_WORKSPACE/$dir"
            # -upgrade is intentional here: this monthly job acts as a drift
            # detector, validating against the newest providers allowed by the
            # version constraints rather than the committed lock files.
            if tofu init -backend=false -upgrade -no-color > /dev/null 2>&1 && tofu validate -no-color > /dev/null 2>&1; then
              PASS=$((PASS + 1))
            else
              FAILED="$FAILED\n- \`$mod\`"
            fi
            cd "$GITHUB_WORKSPACE"
          done
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "passed=$PASS" >> "$GITHUB_OUTPUT"
          if [ -n "$FAILED" ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
            echo -e "$FAILED" > /tmp/failed-validation.txt
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate README usage examples
        id: readme_examples
        run: |
          # Extracts every ```hcl block from module READMEs, rewrites remote
          # git sources back to local paths and runs tofu validate on each
          # example - see .github/scripts/validate-readme-examples.sh.
          set -o pipefail
          if bash .github/scripts/validate-readme-examples.sh /tmp/failed-readme-examples.txt 2>&1 | tee /tmp/readme-examples-output.txt; then
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
          fi
          SUMMARY=$(grep -E '^README examples:' /tmp/readme-examples-output.txt | tail -n 1 || true)
          echo "summary=${SUMMARY:-README examples: none found}" >> "$GITHUB_OUTPUT"

      - name: Generate report
        id: report
        run: |
          {
            echo "## Monthly Module Health Report"
            echo ""
            echo "**Total modules:** ${{ steps.validate.outputs.total }}"
            echo "**Validation:** ${{ steps.validate.outputs.passed }}/${{ steps.validate.outputs.total }} passed"
            echo "**${{ steps.readme_examples.outputs.summary }}**"
            echo ""

            if [ "${{ steps.validate.outputs.has_failures }}" = "true" ]; then
              echo "### ❌ Validation Failures"
              cat /tmp/failed-validation.txt
              echo ""
            fi

            if [ "${{ steps.readme_examples.outputs.has_failures }}" = "true" ]; then
              echo "### ❌ README Example Failures"
              cat /tmp/failed-readme-examples.txt
              echo ""
            fi

            if [ "${{ steps.missing_readme.outputs.found }}" = "true" ]; then
              echo "### ⚠️ Modules Missing README"
              cat /tmp/missing-readme.txt
              echo ""
            fi

            if [ "${{ steps.validate.outputs.has_failures }}" = "false" ] && \
               [ "${{ steps.readme_examples.outputs.has_failures }}" = "false" ] && \
               [ "${{ steps.missing_readme.outputs.found }}" = "false" ]; then
              echo "### ✅ All checks passed"
              echo "All modules have valid configuration and documentation."
            fi
          } | tee /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create issue if problems found
        if: >-
          steps.validate.outputs.has_failures == 'true' ||
          steps.readme_examples.outputs.has_failures == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Module health check - ${new Date().toISOString().slice(0, 7)}`,
              body: report + '\n\n_Generated by `.github/workflows/module-health.yml`_',
              labels: ['automated', 'maintenance']
            });
