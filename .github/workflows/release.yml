name: Create Tags and Releases

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - '**/*.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'LICENSE'

  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'PATCH'
        type: choice
        options:
          - MAJOR
          - MINOR
          - PATCH

# Only one release job at a time - never cancel a running release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Validate ALL modules before releasing ──────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
        with:
          tofu_version: "1.11.5"

      - name: Setup Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: test/go.mod
          cache-dependency-path: test/go.sum

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_MGMT_RO_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: terratest-release-${{ github.sha }}

      - name: Cache OpenTofu provider plugins
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: opentofu-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            opentofu-providers-${{ runner.os }}-

      - name: Create provider plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Validate all modules
        run: task validate

      - name: Run Terratest (validate + plan)
        working-directory: test
        run: |
          set -o pipefail
          go test -v -timeout 30m -count=1 -parallel=4 2>&1 | tee /tmp/terratest-output.txt

      - name: Terratest Summary
        if: always()
        run: bash .github/scripts/terratest-summary.sh /tmp/terratest-output.txt >> "$GITHUB_STEP_SUMMARY"

  # ── Create tag and release ─────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate]
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get the current tag
        id: current_tag
        run: |
          CURRENT_TAG=$(git tag --sort=-v:refname | head -n 1)
          echo "Current tag: $CURRENT_TAG"
          echo "current_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"

      - name: Determine new version
        id: determine_version
        env:
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${{ steps.current_tag.outputs.current_tag }}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            patch=${BASH_REMATCH[3]}
          else
            echo "No valid tag found. Setting to v1.0.0"
            major=1
            minor=0
            patch=0
          fi

          UPDATED_MAJOR_VERSION=$major
          UPDATED_MINOR_VERSION=$minor
          UPDATED_PATCH_VERSION=$((patch + 1))

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUMP_TYPE="${{ inputs.bump }}"
          else
            BUMP_TYPE="PATCH"
            FIRST_LINE=$(echo "$RAW_COMMIT_MSG" | head -n 1)
            echo "Commit message first line: $FIRST_LINE"
            if [[ ${FIRST_LINE,,} =~ ^\[major\] ]]; then
              BUMP_TYPE="MAJOR"
            elif [[ ${FIRST_LINE,,} =~ ^\[minor\] ]]; then
              BUMP_TYPE="MINOR"
            fi
          fi

          echo "Bump type: $BUMP_TYPE"
          if [[ "$BUMP_TYPE" == "MAJOR" ]]; then
            UPDATED_MAJOR_VERSION=$((major + 1))
            UPDATED_MINOR_VERSION=0
            UPDATED_PATCH_VERSION=0
          elif [[ "$BUMP_TYPE" == "MINOR" ]]; then
            UPDATED_MINOR_VERSION=$((minor + 1))
            UPDATED_PATCH_VERSION=0
          fi

          UPDATED_TAG="v$UPDATED_MAJOR_VERSION.$UPDATED_MINOR_VERSION.$UPDATED_PATCH_VERSION"
          echo "Updated tag: $UPDATED_TAG"
          echo "UPDATED_TAG=$UPDATED_TAG" >> "$GITHUB_OUTPUT"

      - name: Build per-module release notes
        id: release_notes
        run: |
          # List every module dir touched since the previous tag. Each changed
          # file is walked up to its nearest ancestor containing a main.tf, so
          # submodule/fixture/README changes attribute to the owning module.
          PREV_TAG="${{ steps.current_tag.outputs.current_tag }}"
          NOTES_FILE=/tmp/release-notes.md
          : > "$NOTES_FILE"
          if [ -n "$PREV_TAG" ]; then
            CHANGED_MODULES=$(git diff --name-only "$PREV_TAG"..HEAD | \
              xargs -r -n1 dirname | sort -u | \
              while read -r dir; do
                d="$dir"
                while [ "$d" != "." ] && [ "$d" != "/" ]; do
                  if [ -f "$d/main.tf" ]; then
                    echo "$d"
                    break
                  fi
                  d=$(dirname "$d")
                done
              done | sort -u)
            if [ -n "$CHANGED_MODULES" ]; then
              {
                echo "## Changed modules"
                echo ""
                echo "Modules changed since \`$PREV_TAG\`:"
                echo ""
                echo "$CHANGED_MODULES" | sed 's/^/- `/; s/$/`/'
                echo ""
              } >> "$NOTES_FILE"
            fi
          fi
          echo "Release notes preamble:"
          cat "$NOTES_FILE"

      - name: Create new tag
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git tag "${{ steps.determine_version.outputs.UPDATED_TAG }}"
          git push origin "${{ steps.determine_version.outputs.UPDATED_TAG }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create a release
        run: |
          # --notes-file content is prepended to the auto-generated notes
          # (GitHub appends generated notes after a provided body).
          gh release create "${{ steps.determine_version.outputs.UPDATED_TAG }}" \
            --generate-notes \
            --notes-file /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release failed for ${context.sha.substring(0, 7)}`,
              body: `The release pipeline failed.\n\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'automated']
            })
