version: "3"

tasks:
  format:
    desc: Format all OpenTofu code recursively
    cmds:
      - tofu fmt -recursive .

  validate:
    desc: Run tofu validate in each module directory
    env:
      TF_PLUGIN_CACHE_DIR: "{{.ROOT_DIR}}/.terraform-plugin-cache"
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/.terraform-plugin-cache"
      - |
        JOBS=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
        find . -type f -name "main.tf" -print0 | \
          xargs -0 -P "$JOBS" -I TFMAIN bash -c '
            dir=$(dirname "TFMAIN")
            echo "Validating module: $dir"
            cd "$dir" && tofu init -backend=false -upgrade -no-color > /dev/null && tofu validate -no-color
          '

  lockfiles:
    desc: (Re)generate .terraform.lock.hcl in every module directory
    env:
      TF_PLUGIN_CACHE_DIR: "{{.ROOT_DIR}}/.terraform-plugin-cache"
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/.terraform-plugin-cache"
      - |
        JOBS=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
        find . -type f -name "main.tf" -print0 | \
          xargs -0 -P "$JOBS" -I TFMAIN bash -c '
            dir=$(dirname "TFMAIN")
            echo "Generating lock file: $dir"
            cd "$dir" && tofu init -backend=false -no-color > /dev/null
          '

  lint-init:
    desc: Initialise tflint plugins (run once before first lint)
    cmds:
      - |
        if ! command -v tflint &> /dev/null; then
          echo "tflint is not installed."
          echo "  macOS:  brew install tflint"
          echo "  Linux:  curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash"
          exit 1
        fi
        tflint --init

  lint:
    desc: Run tflint on all modules (run 'task lint-init' once first to install plugins)
    cmds:
      - |
        if ! command -v tflint &> /dev/null; then
          echo "tflint is not installed."
          echo "  macOS:  brew install tflint"
          echo "  Linux:  curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash"
          exit 1
        fi
        JOBS=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
        find . -type f -name "main.tf" -print0 | \
          xargs -0 -P "$JOBS" -I TFMAIN bash -c '
            dir=$(dirname "TFMAIN")
            echo "Linting module: $dir"
            tflint --chdir "$dir"
          '

  offline-test:
    desc: Run native tofu test (mock providers, no AWS creds) in every module with tests/*.tftest.hcl
    env:
      TF_PLUGIN_CACHE_DIR: "{{.ROOT_DIR}}/.terraform-plugin-cache"
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/.terraform-plugin-cache"
      - |
        JOBS=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
        find . -type f -name "*.tftest.hcl" -path "*/tests/*" \
          -not -path "*/.terraform/*" \
          -not -path "*/.terraform-plugin-cache/*" | \
          xargs -n1 dirname | xargs -n1 dirname | sort -u | \
          xargs -P "$JOBS" -I MODDIR bash -c '
            echo "Offline testing module: MODDIR"
            cd "MODDIR" && tofu init -backend=false -no-color > /dev/null && tofu test -no-color
          '

  test-plan:
    desc: Run Terratest plan on all modules (requires AWS credentials)
    dir: test
    cmds:
      - go test -v -run "TestPlanAllModules" -timeout 30m -count=1 -parallel=16

  security:
    desc: Run Trivy misconfiguration scan (CRITICAL + HIGH)
    cmds:
      - |
        if ! command -v trivy &> /dev/null; then
          echo "trivy is not installed."
          echo "  macOS:  brew install trivy"
          echo "  Linux:  curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin"
          exit 1
        fi
        trivy config \
          --severity CRITICAL,HIGH \
          --skip-dirs ".git,.github,.terrateam" \
          .

  policy:
    desc: Run Conftest OPA policy checks (requires plan JSON)
    cmds:
      - |
        if ! command -v conftest &> /dev/null; then
          echo "conftest is not installed."
          echo "  macOS:  brew install conftest"
          echo "  Linux:  https://www.conftest.dev/install/"
          exit 1
        fi
        echo "OPA policies available in policy/ directory."
        echo "Usage: tofu plan -out=plan.bin && tofu show -json plan.bin | conftest test --policy policy/ -"

  docs:
    desc: Regenerate Requirements/Providers/Inputs/Outputs in every module README (terraform-docs)
    cmds:
      - |
        if ! command -v terraform-docs &> /dev/null; then
          echo "terraform-docs is not installed."
          echo "  macOS:  brew install terraform-docs"
          echo "  Linux:  https://terraform-docs.io/user-guide/installation/"
          exit 1
        fi
        find . -type f -name "main.tf" \
          -not -path "*/.terraform/*" \
          -not -path "*/.terraform-plugin-cache/*" -print0 | \
          xargs -0 -I TFMAIN bash -c '
            dir=$(dirname "TFMAIN")
            echo "Generating docs: $dir"
            terraform-docs --config "{{.ROOT_DIR}}/.terraform-docs.yml" "$dir" > /dev/null
          '

  new-module:
    desc: "Scaffold a new module skeleton (usage: task new-module -- <name>)"
    silent: true
    cmds:
      - |
        NAME="{{.CLI_ARGS}}"
        if [ -z "$NAME" ]; then
          echo "Usage: task new-module -- <name>"
          exit 1
        fi
        if ! echo "$NAME" | grep -Eq '^[a-z][a-z0-9-]*$'; then
          echo "Module name must be lowercase alphanumeric with hyphens (e.g. my-module)."
          exit 1
        fi
        DIR="{{.ROOT_DIR}}/$NAME"
        if [ -e "$DIR" ]; then
          echo "Refusing to scaffold: $DIR already exists."
          exit 1
        fi
        mkdir -p "$DIR/test"

        cat > "$DIR/providers.tf" <<EOF
        terraform {
          required_version = ">= 1.11.0"

          required_providers {
            aws = {
              source  = "hashicorp/aws"
              version = ">= 6.49, < 7.0"
            }
          }
        }
        EOF

        cat > "$DIR/variables.tf" <<EOF
        variable "enabled" {
          description = "Set to false to prevent the module from creating any resources."
          type        = bool
          default     = true
        }

        variable "name" {
          description = "The name of the $NAME to create"
          type        = string

          validation {
            condition     = length(trimspace(var.name)) > 0
            error_message = "name must be a non-empty string."
          }
        }

        variable "tags" {
          description = "Map of tags to apply to all resources."
          type        = map(string)
          default     = {}
        }
        EOF

        cat > "$DIR/main.tf" <<EOF
        data "aws_region" "current" {}

        locals {
          enabled = var.enabled
          name    = var.name

          tags = merge(var.tags, {
            ManagedBy = "opentofu"
            Region    = data.aws_region.current.region
          })
        }

        ################################################################################
        # $NAME
        ################################################################################

        # TODO: add resources here.
        # Gate single resources with \`lifecycle { enabled = local.enabled }\` and
        # for_each resources with \`for_each = { for k, v in var.items : k => v if local.enabled }\`.
        EOF

        cat > "$DIR/outputs.tf" <<EOF
        # TODO: expose all useful resource attributes via try(), e.g.
        #
        # output "id" {
        #   description = "The ID of the $NAME"
        #   value       = try(aws_xxx.this.id, "")
        # }
        EOF

        cat > "$DIR/README.md" <<EOF
        # $NAME

        OpenTofu module to create and manage AWS $NAME.

        ## Usage

        \`\`\`hcl
        module "$(echo "$NAME" | tr '-' '_')" {
          source = "git::https://github.com/yasithab/opentofu-modules.git//$NAME?depth=1&ref=master"

          name = "example"

          tags = {
            Environment = "production"
          }
        }
        \`\`\`

        <!-- BEGIN_TF_DOCS -->
        <!-- END_TF_DOCS -->
        EOF

        cat > "$DIR/test/test.tfvars" <<EOF
        name = "terratest-plan"
        EOF

        echo "Scaffolded module: $DIR"
        echo "Next steps:"
        echo "  1. Add resources to $NAME/main.tf and outputs to $NAME/outputs.tf"
        echo "  2. Run: task format && task validate"
        echo "  3. Run: task docs   # populate README Inputs/Outputs"

  ci:
    desc: Run all CI tasks (format + validate + lint + offline-test + security)
    deps: [format, validate, lint, offline-test, security]
